<h2>Mes réservations</h2>

<table border="1" width="100%">
  <tr>
    <th>ID</th>
    <th>Numéro de place</th>
    <th>Action</th>
  </tr>

  <tr *ngFor="let r of reservations">
    <td>{{ r.id }}</td>
    <td>{{ r.seat_number }}</td>
    <td>
      <button
        type="button"
        class="btn btn-success"
        (click)="payer(r.id)">
        Payer
      </button>
    </td>
  </tr>
</table>
