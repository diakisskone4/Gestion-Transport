<h2>Nouvelle réservation</h2>

<div class="card p-3 mb-4">
  <div class="form-group">
    <label>Nombre de places</label>
    <input
      type="number"
      class="form-control"
      min="1"
      [(ngModel)]="seatNumber"
    />
  </div>

  <button
    class="btn btn-primary mt-2"
    (click)="reserver()">
    Réserver
  </button>
</div>

<hr />

<h2>Mes réservations et la liste de réservation faite</h2>

<table border="1" width="100%">
  <tr>
    <th>ID</th>
    <th>Trajet</th>
    <th>Nombre de places</th>
    <th>Date</th>
    <th>Action</th>
  </tr>

  <tr *ngFor="let r of reservations">
    <td>{{ r.id }}</td>
    <td>{{ r.trip.departure }} → {{ r.trip.destination }}</td>
    <td>{{ r.seat_number }}</td>
    <td>{{ r.created_at | date:'short' }}</td>
    <td>
      <button
        class="btn btn-success"
        (click)="payer(r.id)">
        Payer
      </button>
    </td>
  </tr>
</table>
