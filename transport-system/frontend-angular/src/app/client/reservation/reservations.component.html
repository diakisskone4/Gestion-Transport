<h2>Mes réservations</h2>

<table border="1">
  <tr>
    <th>ID</th>
    <th>Place</th>
    <th>Action</th>
  </tr>

  <tr *ngFor="let r of reservations">
    <td>{{ r.id }}</td>
    <td>{{ r.numeroPlace }}</td>
    <td>
      <button (click)="payer(r.id)">Payer / Ticket</button>
    </td>
  </tr>
</table>
