<div class="dashboard-container">
  <h2>Tableau de bord Client</h2>

  <div class="user-info" *ngIf="user">
    <p><strong>Nom d'utilisateur :</strong> {{ user.username }}</p>
    <p><strong>Email :</strong> {{ user.email }}</p>
  </div>

  <hr />

  <div class="dashboard-sections">
    <div class="card">
      <h3>Mes réservations</h3>
      <p>Consulter vos trajets réservés.</p>
      <a routerLink="/client/reservations">
        <button>Voir mes réservations</button>
      </a>
    </div>

    <div class="card">
      <h3>Trajets disponibles</h3>
      <p>Explorer et réserver de nouveaux trajets.</p>
      <a routerLink="/client/trajets">
        <button>Réserver un trajet</button>
      </a>
    </div>

    <div class="card">
      <h3>Notifications</h3>
      <p>Voir vos dernières alertes et messages.</p>
      <a routerLink="/client/notifications">
        <button>Voir mes notifications</button>
      </a>
    </div>
  </div>

  <hr />

  <button class="logout-btn" (click)="logout()">Se déconnecter</button>
</div>
