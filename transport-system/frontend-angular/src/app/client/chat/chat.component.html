<div class="chat-container">
  <!-- En-tête du chat -->
  <div class="chat-header">
    <span>
      <i class="bi bi-headset"></i>
      Support Client
    </span>
    <i class="bi bi-shield-check"></i>
  </div>

  <!-- Zone des messages -->
  <div class="chat-messages" #scrollMe [scrollTop]="scrollMe.scrollHeight">
    <!-- Message de bienvenue si pas de messages -->
    <div *ngIf="messages.length === 0" class="empty-chat">
      <i class="bi bi-chat-dots"></i>
      <p>Bienvenue sur le chat !</p>
      <small>Posez vos questions, nous vous répondrons rapidement.</small>
    </div>

    <!-- Liste des messages -->
    <div
      *ngFor="let m of messages"
      class="message"
      [class.sent]="isSent(m)"
      [class.received]="!isSent(m)"
    >
      <div class="message-avatar" *ngIf="!isSent(m)">
        <i class="bi bi-person-badge"></i>
      </div>
      <div class="bubble">
        {{ m.contenu }}
        <div class="time">{{ m.date | date:'HH:mm' }}</div>
      </div>
    </div>
  </div>

  <!-- Zone de saisie -->
  <div class="chat-input">
    <input
      [(ngModel)]="contenu"
      placeholder="Écrivez votre message..."
      (keyup.enter)="envoyer()"
      [disabled]="!contenu && !messages.length"
    />
    <button 
      (click)="envoyer()" 
      [disabled]="!contenu.trim()"
      title="Envoyer"
    >
      <i class="bi bi-send"></i>
    </button>
  </div>
</div>
