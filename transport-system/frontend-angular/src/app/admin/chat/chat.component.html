<div class="chat-container">

  <div class="chat-header">
    <span>Chat Administrateur</span>
  </div>

  <!-- Sélection du client par NOM -->
  <div style="padding:10px; background:#f0f0f0;">
    <select
      [(ngModel)]="selectedClientId"
      (change)="load()"
      style="width:100%; padding:8px;"
    >
      <option value="">— Sélectionner un client —</option>
      <option *ngFor="let c of clients" [value]="c.id">
        {{ c.username }}
      </option>
    </select>
  </div>

  <div class="chat-messages">
    <div
      *ngFor="let m of messages"
      class="message"
      [class.sent]="isSent(m)"
      [class.received]="!isSent(m)"
    >
      <div class="bubble">
        <strong>{{ m.expediteur?.username }}</strong><br>
        {{ m.contenu }}
        <div class="time">{{ m.date | date:'shortTime' }}</div>
      </div>
    </div>
  </div>

  <div class="chat-input">
    <input
      [(ngModel)]="contenu"
      placeholder="Message..."
      [disabled]="!selectedClientId"
    />
    <button
      (click)="envoyer()"
      [disabled]="!selectedClientId"
    >
      ➤
    </button>
  </div>

</div>
