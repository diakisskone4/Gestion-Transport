<h2>Gestion des Paiements</h2>
<p>Liste des paiements effectués par les clients.</p>

<hr />

<!-- ⏳ Chargement -->
<p *ngIf="loading" class="text-muted">
  Chargement des paiements...
</p>

<!-- ℹ️ Message -->
<p *ngIf="message && !loading" class="alert alert-info">
  {{ message }}
</p>

<!-- 📊 Tableau des paiements -->
<table
  class="table table-bordered table-striped"
  *ngIf="!loading && paiements.length > 0"
>
  <thead class="table-dark">
    <tr>
      <th>ID</th>
      <th>Réservation</th>
      <th>Montant</th>
      <th>Date</th>
      <th>Statut</th>
    </tr>
  </thead>

  <tbody>
    <tr *ngFor="let p of paiements; trackBy: trackById">
      <td>{{ p.id }}</td>
      <td>Réservation #{{ p.reservation }}</td>
      <td>{{ p.montant }} FCFA</td>
      <td>{{ p.date_paiement | date:'short' }}</td>
      <td>
        <span class="badge bg-success" *ngIf="p.statut === 'PAYE'">
          PAYÉ
        </span>
        <span class="badge bg-secondary" *ngIf="p.statut !== 'PAYE'">
          {{ p.statut }}
        </span>
      </td>
    </tr>
  </tbody>
</table>

<!-- 🚫 Aucun paiement -->
<p *ngIf="!loading && paiements.length === 0 && !message" class="text-muted">
  Aucun paiement enregistré.
</p>
